version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: pypycode_nginx
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - pypycode-server

  vega:
    build:
      context: ./vega
      dockerfile: Dockerfile
    container_name: pypycode_vega
    command: gunicorn -w 2 -b 0.0.0.0:5001 "vega_service:app"
    env_file:
      - ./vega/.env
    environment:
      # Vega's BackendClient calls back to the API service over the docker network
      - VEGA_BACKEND_BASE_URL=http://api:5000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - pypycode-server

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pypycode_api
    command: gunicorn -w 4 -b 0.0.0.0:5000 "app:create_app()"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PROBLEM_INGEST_KEY=${PROBLEM_INGEST_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRODUCT_ID=${STRIPE_PRODUCT_ID}
      - STRIPE_ANNUAL_PRICE_CENTS=${STRIPE_ANNUAL_PRICE_CENTS}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY}
      - FRONTEND_URL=${FRONTEND_URL}
      - VEGA_SERVICE_URL=http://vega:5001
      # Email configuration
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - MAIL_ADMIN_EMAIL=${MAIL_ADMIN_EMAIL}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - pypycode-server

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pypycode_worker
    command: celery -A app.celery_app worker --loglevel=warning --concurrency=8
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SANDBOX_IMAGE=pypycode-sandbox:latest
      # Email configuration
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - MAIL_ADMIN_EMAIL=${MAIL_ADMIN_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - pypycode-server

  redis:
    image: redis:7-alpine
    container_name: pypycode_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - pypycode-server

volumes:
  redisdata:

networks:
  pypycode-server:
    driver: bridge
