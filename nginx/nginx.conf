upstream pypycode_backend {
    server api:5000;
}
 
server {
    listen 80;
    server_name _;
 
    # Route admin requests to backend
    location /admin/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemaps are generated by the API from the problems table (SEO)
    location ~ ^/sitemap.*\.xml$ {
        proxy_pass http://pypycode_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached forever
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Serve React frontend. $uri.html lets build-time prerendered pages
    # (e.g. /pricing -> pricing.html) win over the generic SPA shell.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /index.html;
    }
 
    # Remove /api/ prefix when forwarding to Flask
    location /api/ {
        proxy_pass http://pypycode_backend/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
        client_max_body_size 100M;
    }
 
    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
